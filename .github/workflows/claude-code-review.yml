name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # ~~Skip the develop→main release/promotion PR (huge diff, nothing new to review) — auto-review
    # only PRs that target develop, where it adds value.~~ THAT CONDITION WAS `base.ref != 'main'`,
    # AND IT NEVER ONCE EVALUATED TRUE HERE. It was written for a GitFlow repo with a long-lived
    # `develop`; this repo is trunk-based (methodology ADR-0003), so every PR targets `main` and the
    # job reported `skipping` on every run since it was added. Struck rather than deleted, because a
    # deleted condition reads as though nothing was ever wrong.
    #
    # Skipped and green are indistinguishable at a glance, which is why it survived: `gh pr checks`
    # shows a row either way, and nobody reads a skip as an absence. Found on #180 by the gate, while
    # answering "which jobs ran and which were filtered" — a question that only gets a true answer
    # when someone is made to name both halves.
    #
    # It runs on every PR now, and it is ADVISORY: `quality-assurance` is the merge gate and this
    # blocks nothing. Its value is being a SECOND reader of a repo that has exactly one — the gate
    # itself said, verdict on #180, that "a context that approved and merged it would have no
    # observer". This is the observer, and it costs one comment per PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `pull-requests: write` because the review is delivered AS a PR comment — with `read` the job
      # would run, do the work, and fail to post it, which is a worse failure than not running: a
      # green row and no output. Untested before this change for the obvious reason that the job
      # never reached the posting step.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

