name: docs-test

# Its own workflow rather than a step in `hooks-test`, and the reason is the FILTER, not tidiness.
#
# `hooks-test` is path-filtered to `hooks/**` and says why: nothing outside that directory can change
# what the permission guard does. That is true of the guard and false of this suite — what falsifies
# an inventory count is adding a file under `commands/` or `agents/`, which `hooks/**` never matches.
# Hanging this on that workflow would have produced a gate that runs on every change EXCEPT the one
# it exists to catch: green on the PR that breaks it, and never red at all.
#
# The suite lives in `hooks/scripts/` because that is where this repo keeps its shell test suites
# (`hooks-executable.test.sh` is likewise not a hook). One test home beats two; the gates are what
# differ, so the gates are what split.
#
# DO NOT COPY THIS SHAPE INTO `tadeumendonca-io` — a workflow-level `paths:` filter is safe HERE and a
# bug THERE. That repo has required status checks, and a required check on a non-matching PR never
# reports at all: it sits pending forever and the PR can never merge. Its convention is therefore to
# run every workflow on every PR and filter INSIDE the job. This repo has no required status checks
# (`main` protection carries review and force-push rules and no `required_status_checks`), so nothing
# can be left pending and the cheaper filter is correct. The difference is branch protection, not
# taste, so check it before reusing this.

on:
  pull_request:
    paths:
      - "agents/**"
      - "commands/**"
      # `skills/**` — the library itself, which moved out of `commands/` on #164. This is the SEVENTH
      # occurrence of the miss enumerated below, and the first one caught by the instrument built for it
      # rather than by a person: the gate-coverage assertion in `inventory-counts.test.sh` went red on
      # the move with all 69 files named, because they are in its scan set and matched no glob here.
      # Without this line a PR editing only a skill starts NO gate at all — green on the PR that breaks
      # it, and never red afterwards.
      - "skills/**"
      - "README.md"
      - "CLAUDE.md"
      # `hooks/**`, not just this suite's own file. The suite now asserts the hook inventory too, so
      # registering a hook falsifies the README exactly the way adding a skill does — and until this
      # line existed, adding one could not START the gate that would have caught it. That is how the
      # diagram published three hooks against a `hooks.json` registering four. It supersedes the
      # narrower `hooks/scripts/inventory-counts.test.sh` entry that used to sit here.
      - "hooks/**"
      # `.claude-plugin/**` for the same reason, found the same way. `inventory-counts.test.sh` reads
      # `plugin.json` and `marketplace.json` in its INVENTORY_DOCS list — so a count is asserted there
      # while an edit that touches only those files could not START the gate asserting it. Exposed on
      # 2026-08-04: the persona merge 6 → 5 left `plugin.json` publishing "6 subagent personas", and
      # the suite caught it only because the same PR also changed `agents/` and `README.md`. Remove
      # those two coincidences and it ships. Identical in shape to the `hooks/**` note above.
      - ".claude-plugin/**"
      # `docs/**`, for the third time and the same reason. The suite's floor-claim assertion scans
      # every tracked `.md`/`.sh`, and that now includes `docs/adr/**` — which is the ONLY layer the
      # stale-claim defect was actually left in (the hook header had already been re-tensed; the ADRs
      # had not). Without this line, a PR that edits only an ADR could reintroduce the exact defect
      # and never start the gate asserting against it: green on the PR that breaks it, and never red
      # at all — the failure this file's own header warns about twice.
      - "docs/**"
      # `PRINCIPLES.md` was added here as the FOURTH occurrence of the same miss, and has since been
      # folded into the README — a floor behind a click is a floor nobody reads — so its entry is gone
      # with it. The history is kept because the CAUSE is what matters and it outlives the file: the
      # suite's scan set was derived while this filter was enumerated, extended by whichever miss
      # someone happened to measure, and **nobody diffed the two sets against each other**.
      #
      # THAT IS NOW ASSERTED RATHER THAN SWEPT. `inventory-counts.test.sh` checks that every file it
      # scans is a file this filter can start on, so a fifth occurrence goes red in CI instead of
      # waiting to be noticed by a reviewer — which is what the first four depended on.
      # `.claude/**` is the FIFTH occurrence, and the first one the check above could not see. The
      # suite reads `.claude/settings.json` — the floor-claims assertion parses its `allow` list —
      # but the gate-coverage check derived its input from `FLOOR_CLAIM_FILES`, which is
      # `git ls-files -- '*.md' '*.sh'`. A `.json` file was never in that set, so the instrument
      # written after four misses passed green on the fifth. Measured on #150, which changed exactly
      # this file and started no gate. The check now reads the union of ALL SIX sources the suite
      # opens — not "both", which is what this comment said until the reviewer counted them: the
      # first fix unioned two, and its own prose called that complete. The correction is that the
      # union is built from the variables rather than from memory. It goes red here now rather than
      # waiting for a reviewer, which is what all five previous occurrences depended on.
      - ".claude/**"
      # `.github/**` is the EIGHTH occurrence, and the first one the gate-coverage check produced
      # BEFORE the miss could ship rather than after someone measured it. It was numbered SIXTH when
      # written, which collided with the `skills/**` entry above: the sequence is repo-wide, not
      # per-file, and the sixth is the one recorded in `hooks-test.yml`'s own header — `commands/**`
      # missing from that filter, caught by `quality-assurance` on PR #178 and fixed at `1ceb507`,
      # whose `hooks-test.yml` HEADER EDIT states it outright (*"a mistake this repo has now made SIX
      # times; `docs-test.yml`'s header enumerates the first five, and the sixth is recorded below in
      # its own words"*) — that commit's MESSAGE does not carry the sentence, and an earlier form of
      # this comment attributed it there (`quality-assurance` on #289, B5: `git log -1 --format=%B
      # 1ceb507 | grep -c "SIX times"` -> 0; the same grep over `hooks-test.yml` -> 1). The
      # seventh is `skills/**` above, added hours later the same day at `f1ca0ed` (#164). So the
      # ordinals in this file read FOURTH, FIFTH, SEVENTH, EIGHTH with the sixth living in the other
      # workflow — a gap on the page, not a gap in the count. The citation-resolution
      # assertions added on #283 scan every tracked `.md`/`.sh`/`.yml`/`.json`/`.py`, and decision-record
      # citations are measured live in four `.github/ISSUE_TEMPLATE/*.yml` files and in
      # `.github/workflows/claude-code-review.yml`. Those files were in the scan set and matched no glob
      # here, so a PR editing only an issue template could break a citation and never start the gate
      # asserting against it — green on the way in, never red afterwards, exactly the shape this file's
      # header warns about twice.
      #
      # It SUPERSEDES the narrower `.github/workflows/docs-test.yml` entry that used to sit here (that
      # entry existed so the gate re-runs when this filter itself changes; `.github/**` covers it).
      - ".github/**"
      # `powers/**` is the TENTH occurrence, and it is the first one this repo caught BEFORE the merge
      # rather than after — `inventory-counts.test.sh`'s gate-coverage assertion went red on the PR
      # that introduced the export, naming all 14 files. The gate worked; the build report read
      # `73/0` off a run it had not re-taken and published a red suite as green, which is a REPORTING
      # defect on top of the filter one and is worth separating from it.
      #
      # THE CAUSE IS THE HEADER'S CAUSE, ONE LAYER OVER. `kiro-power.test.sh` shipped its own
      # gate-coverage assertion for `hooks-test.yml` — the workflow ITS suite runs in — and that
      # assertion passed. The tree it added was also read by a DIFFERENT suite in a DIFFERENT
      # workflow, and nothing asserted that pair. Per-suite coverage of one's own workflow is
      # necessary and is not sufficient: what closes the class is that `inventory-counts` derives its
      # scan set from `git ls-files` and therefore sees every new tracked `.md`/`.sh`/`.yml`/`.json`/
      # `.py` in the repo without being told the tree exists. That is why this line is a one-line fix
      # and not a new instrument.
      - "powers/**"

permissions:
  contents: read

jobs:
  inventory-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL HISTORY, AND THE SUITE FAILS WITHOUT IT. The roster-membership assertions derive the
          # set of RETIRED personas from `git log --diff-filter=D -- 'agents/*.md'` — the names that
          # once had a file and no longer do. `actions/checkout` defaults to `fetch-depth: 1`, on which
          # that command returns NOTHING, and an absence check over an empty set of names passes
          # vacuously: green in CI, red on a maintainer's machine, for a reason nothing prints.
          #
          # The suite asserts the set is non-empty rather than trusting this line, so removing it goes
          # red instead of quiet. Both halves are needed — this makes it work, that makes the failure
          # legible.
          fetch-depth: 0

      - name: Assert the published inventory counts match the repo
        run: bash hooks/scripts/inventory-counts.test.sh
