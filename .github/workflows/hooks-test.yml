name: hooks-test

# The permission guard is the only thing in this plugin that can HALT a consuming repo's agent.
# A regression is therefore either a hole in the irreversible floor or a wedged dev loop — both
# expensive, and neither visible until someone hits it locally. So the guard's behaviour is a gate:
# every DENY it must make, and every ALLOW it must not break, is asserted on the PR that changes it.
#
# Path-filtered to hooks/ — nothing else in the repo can change what the guard does.

on:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/hooks-test.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DISCOVERED, not enumerated. This step listed three suites by name and two new ones landed
      # beside it unnoticed: the job passed in 7s having run none of the new assertions, while
      # `hooks-executable.test.sh` — which discovers from hooks.json — picked the same scripts up
      # automatically. An enumeration FAILS OPEN, which is the argument the consuming repo's guide
      # makes about its own boundary list, committed here in a workflow.
      #
      # The `::notice::` names which suites ran, because a gate that matched nothing must not read
      # like one that passed — and with discovery, "which ones" is no longer knowable from the file.
      - name: Run every hook suite
        run: |
          set -euo pipefail
          found=0
          for suite in hooks/scripts/*.test.sh; do
            [ -e "$suite" ] || continue
            found=$((found + 1))
            echo "── $suite"
            bash "$suite"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no hook suite matched hooks/scripts/*.test.sh — discovery is broken, not clean"
            exit 1
          fi
          echo "::notice::the hook gate ran $found suite(s): $(echo hooks/scripts/*.test.sh | tr ' ' ',')" 
