name: hooks-test

# The permission guard is the only thing in this plugin that can HALT a consuming repo's agent.
# A regression is therefore either a hole in the irreversible floor or a wedged dev loop — both
# expensive, and neither visible until someone hits it locally. So the guard's behaviour is a gate:
# every DENY it must make, and every ALLOW it must not break, is asserted on the PR that changes it.
#
# THE FILTER IS THE UNION OF WHAT EVERY SUITE HERE READS — NOT WHERE THE SUITES LIVE, AND NOT WHAT EACH
# ONE IS "ABOUT". That distinction is the whole content of this note, because deriving it the other way
# is a mistake this repo has now made SIX times; `docs-test.yml`'s header enumerates the first five, and
# the sixth is recorded below in its own words rather than quietly fixed.
#
# `hooks/**` — the guard suites. The permission guard is the only thing in this plugin that can HALT a
# consuming repo's agent, so a regression is either a hole in the irreversible floor or a wedged dev
# loop, and nothing outside `hooks/` changes what it does.
#
# `agents/**`, `skills/**` AND `commands/**` — all three for `skills-resolve.test.sh`, which reads TWO
# trees and is the reason this filter is no longer a one-liner. It parses `skills:` out of `agents/*.md`
# and resolves each identifier against the library, so EITHER side can falsify it:
#   * edit an identifier            → `agents/**`               catches it;
#   * rename or delete its target   → `skills/**`/`commands/**` catches it.
# `agents/**` shipped in #172 and `commands/**` did NOT, which left the suite unable to fire on the
# second class — precisely #164 step 3, and precisely what #174 already performed once. A wrong
# identifier fails at 0 bytes of stderr, so that gap was the silent half of a check built against
# silence. Caught by `quality-assurance` on PR #178 (B1), not by CI, because no instrument here can yet
# see a filter narrower than its suite's inputs.
#
# `skills/**` IS THE SAME ENTRY THREE TREES LATER (#164; still correct after #182, which re-nested the
# library to `skills/<family>/<name>/SKILL.md`, and after #286, which flattened it back to
# `skills/<name>/SKILL.md` — `**` matches any depth, so the glob has never had to move). That the ENTRY
# survived three reshapings while the PROSE beside it went stale twice is the point worth carrying: a
# glob written against a tree's ROOT is depth-agnostic and a sentence describing that tree is not.
# The resolution target of every identifier moved with the library, and `commands/**` — added one slice earlier for
# exactly this reason — stopped covering the half it was added for. `commands/**` is KEPT rather than
# swapped: the two typed commands still live there and `new-issue` is a live `skills:` identifier, so
# both trees can still falsify this suite.
#
# THE CAUSE, STATED SO THE SEVENTH OCCURRENCE IS HARDER: the filter was derived from where the suite's
# SUBJECT lives rather than from the union of trees it READS. `inventory-counts.test.sh` has a
# gate-coverage assertion built after the earlier misses, but it is scoped to that suite's own input
# variables and cannot see this workflow. So when adding a step here, ask what the script OPENS — every
# path, not the one in its name — and put each of those trees in this list.

on:
  pull_request:
    paths:
      - "hooks/**"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      # `powers/**` — the Kiro Power export, for `kiro-power.test.sh`, and it is the SAME union rule
      # stated in the header rather than a new consideration. That suite reads THREE trees: the
      # generator and itself under `hooks/**`, the source library under `skills/**`, and the committed
      # export here. Either side can falsify it — edit a source skill and the export goes stale; edit
      # the export by hand and it stops matching the generator — so both must be able to START this
      # workflow. Without this line a PR that touches only the export runs no gate at all, which is the
      # ninth occurrence of the miss this header enumerates and the one the export's own drift risk
      # depends on. The suite asserts this entry exists, so removing it goes red instead of quiet.
      - "powers/**"
      # The next three were added when `kiro-power.test.sh`'s gate-coverage assertion was widened from
      # one hardcoded glob to the DERIVED union of every path that suite reads. The narrow form checked
      # `powers/**` and passed while these three were uncovered — so the assertion written to close this
      # class was itself green with the class open three times over. Each is a real falsifier:
      #   * `.bumpversion.toml`   — the release-wiring assertion reads it. Drop the Kiro manifest entry
      #     and a release leaves the Power advertising a version that does not exist; without this line
      #     the PR doing so starts no gate. It is also the sharp case: `.toml` is in NO suite's
      #     `git ls-files` scan set, so nothing else in this repo would ever have noticed it.
      #   * `VERSION`             — the version-lockstep assertion compares it against the manifest.
      #   * `.claude-plugin/**`   — the forward-export assertion reads the `skills` array out of
      #     `plugin.json`; a skill removed there alone falsifies the export and must start this gate.
      - ".bumpversion.toml"
      - "VERSION"
      - ".claude-plugin/**"
      - ".github/workflows/hooks-test.yml"
      # `.mcp.json` — for `mcp-guard.test.sh`, whose last three assertions read it directly: that it
      # declares the `chrome-devtools` server the guard and `agents/product-lead.md` both name, that
      # the browser keeps its `--allowedUrlPattern` origin bound, and that it keeps its `--isolated`
      # throwaway profile.
      #
      # THE FALSIFIER, and it is the reason this line is not tidiness. A change that deletes
      # `--allowedUrlPattern` UNBOUNDS the browser — the persona could then navigate anywhere, which is
      # the whole egress argument the grant rests on. That change touches one file. Without this entry
      # the PR making it starts no job holding the assertion, and ships green.
      #
      # `docs-test.yml` also lists `.mcp.json`, added one round earlier, and that is NOT this. It was
      # added to satisfy `inventory-counts.test.sh`'s gate-coverage arm — the file is in that suite's
      # `git ls-files` scan set. But `inventory-counts.test.sh` contains ZERO occurrences of `mcp`, so
      # the job it starts asserts nothing about the origin bound. **The glob made the coverage arm
      # green without gating the thing.** This entry is the one that actually starts the assertion.
      - ".mcp.json"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the permission-guard suite
        run: bash hooks/scripts/permission-guard.test.sh

      - name: Run the wip-guard suite
        run: bash hooks/scripts/wip-guard.test.sh

      - name: Run the session-wip suite
        run: bash hooks/scripts/session-wip.test.sh

      - name: Run the skills-resolve suite
        run: bash hooks/scripts/skills-resolve.test.sh

      - name: Run the orchestrator-tool-census suite
        run: bash hooks/scripts/orchestrator-tool-census.test.sh

      - name: Run the premature-pr-link-detect suite
        run: bash hooks/scripts/premature-pr-link-detect.test.sh

      # TWO SUITES HAVE NEVER HAD A STEP HERE — `zombie-loop-detect.test.sh` and
      # `session-plugin-version.test.sh`. Both were written mutation-checked and then left to be run by
      # hand, which is a gate one forgotten habit away from absent: exactly the "a green that proves
      # nothing" shape this repo names as the failure the harness discipline exists to catch, sitting in
      # the directory that catches it for everything else. Found while adding the step above, because
      # adding one meant reading the list. Both pass at head (25 and 27 assertions), so this closes the
      # gap rather than opening a red. NAMED RATHER THAN FOLDED IN SILENTLY: this is adjacent to #327's
      # subject, not part of it, and it is two lines rather than a slice.
      - name: Run the zombie-loop-detect suite
        run: bash hooks/scripts/zombie-loop-detect.test.sh

      - name: Run the session-plugin-version suite
        run: bash hooks/scripts/session-plugin-version.test.sh

      # Added with the hook itself (#326), in the same slice, deliberately: the two suites named in the
      # comment above were written and then left to a habit for weeks, and a guard whose suite runs only
      # by hand is the same "installed-looking and inert" shape this guard's own matcher measurement is
      # about. Adding the hook and its CI step in different slices is how that gap opens.
      - name: Run the dispatch-premise-guard suite
        run: bash hooks/scripts/dispatch-premise-guard.test.sh

      # Same rule as the comment above, applied in the same slice as the hook (#337). This suite stubs
      # `gh` and builds a real temporary git repository, so it needs no network and no token — the hook
      # itself does, and that dependency is why the suite asserts CALL SHAPES rather than results for the
      # two arms that talk to the tracker.
      - name: Run the closure-artifact-guard suite
        run: bash hooks/scripts/closure-artifact-guard.test.sh

      # Same rule again, in the same slice as the hook (#342). This one has a sharper reason than
      # habit: `preflight.sh` is the only script here that can REFUSE A PROMPT, so a regression in it
      # does not degrade a control — it wedges the session. A suite for that which runs only when
      # somebody remembers is worse than none, because it reads as covered.
      - name: Run the preflight suite
        run: bash hooks/scripts/preflight.test.sh

      # Same rule a FOURTH time (#355), and this one is recorded as a violation rather than as a
      # convention followed. The hook shipped in one commit and its step arrived only after
      # `quality-assurance` measured `grep -rn "mcp-guard.test.sh" .github/workflows/` returning
      # nothing — so for the length of one review round, 28 assertions protecting the browser's
      # read-only narrowing, its origin bound and the deny-by-default persona table existed and ran
      # nowhere. The suite was quoted in a `## Gates` list beside suites CI actually runs, which is
      # what made local-only read as covered: the defect was not the missing step, it was that the
      # missing step was invisible from the report. The comment three blocks up already said, in this
      # file, that adding a hook and its CI step in different slices is how the gap opens.
      - name: Run the mcp-guard suite
        run: bash hooks/scripts/mcp-guard.test.sh

      - name: Assert every hook script is committed executable
        run: bash hooks/scripts/hooks-executable.test.sh

      - name: Assert the Kiro Power export matches its generator
        run: bash hooks/scripts/kiro-power.test.sh
