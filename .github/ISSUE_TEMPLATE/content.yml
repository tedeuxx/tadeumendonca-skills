name: Content
description: Something published in the owner's own voice — an article, a positioning change, site copy. Boundary class by default (see the `content` label).
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Only the owner opens work. This template exists so `/new-issue` (and a human filing directly)
        close the same description the two-lead intake produces — see `commands/new-issue.md` for the
        full process this mirrors.
  - type: textarea
    id: request
    attributes:
      label: What you want published or changed
      description: The piece, the surface, or the positioning change — in your own words.
    validations:
      required: true
  - type: textarea
    id: search
    attributes:
      label: What the search found
      description: |
        Was this already decided somewhere — the positioning source, an ADR, a closed Issue, an
        existing published piece it would contradict or duplicate?
        One of three answers: it was decided and here is why · it was decided and a premise changed ·
        nothing decides it (say so explicitly).
    validations:
      required: true
  - type: textarea
    id: intake
    attributes:
      label: Two-lead intake
      description: |
        `product-lead`'s copy/positioning half (voice, cross-surface coherence, whether a claim is
        true) and `tech-lead`'s half if the piece touches anything structural. If either recommends
        defer or drop, say so here rather than omitting it.
    validations:
      required: false
  - type: input
    id: parent
    attributes:
      label: "Parent (if this is a task, not a story)"
      description: "Parent: #N — a task is an Issue child, per ADR-0014. Leave blank for a story-level Issue."
      placeholder: "#N"
    validations:
      required: false
  - type: dropdown
    id: class
    attributes:
      label: Class
      description: "Content defaults to boundary — publishing under the owner's name is not reversible by a revert alone."
      options:
        - boundary
        - safe
    validations:
      required: true
  - type: input
    id: intake-stamp
    attributes:
      label: Intake stamp
      description: "Date and the main SHA the leads read, once the description closes."
      placeholder: "YYYY-MM-DD, <sha>"
    validations:
      required: false
