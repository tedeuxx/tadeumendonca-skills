[tool.bumpversion]
current_version = "2.0.51"
commit = true
tag = true
tag_name = "v{new_version}"
message = "bump: {current_version} → {new_version}"
tag_message = "bump: {current_version} → {new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "VERSION"

[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# The Kiro Power's own manifest. A SECOND distribution surface means a second place the version is
# published to a consumer, and it is not derived from the first at install time — Kiro reads this file
# out of a clone. Left off this list, a release would bump VERSION and the Claude Code manifest and
# leave the Kiro package advertising a version that no longer exists, with every other gate green.
# `kiro-power.test.sh` asserts both halves: that this entry exists, and that the two versions agree.
[[tool.bumpversion.files]]
filename = "powers/tadeumendonca-skills/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# The Codex carrier's own manifest — a THIRD distribution surface, and the same argument the Kiro
# entry above makes, arriving one harness later. Codex reads `.codex-plugin/plugin.json` out of a
# clone, so the version it advertises is not derived from `VERSION` at install time. Left off this
# list, a release would bump the other three and leave the Codex package naming a version that no
# longer exists, with every other gate green. `codex-hook-adapter.test.py` asserts both halves: that
# this entry exists, and that the two versions agree.
[[tool.bumpversion.files]]
filename = ".codex-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
